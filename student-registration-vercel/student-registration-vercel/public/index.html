
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talentfarm Platform Registration</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <main class="container">

    <div class="brand-logo">
      <img src="/talentfarm-logo.png" alt="Talentfarm Logo">
    </div>

    <header class="brand">
      <p class="eyebrow">TALENTFARM PLATFORM</p>
      <h1>Talentfarm Platform Registration</h1>
      <p class="subtitle">Please fill in your details to complete registration.</p>
    </header>

    <form id="registrationForm">

      <h2>Personal Information</h2>

      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name"
          placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="rollNo">Roll Number *</label>
        <input type="text" id="rollNo" name="rollNo"
          placeholder="Enter your roll number" required>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number *</label>
        <input type="tel" id="mobile" name="mobile"
          placeholder="Enter 10-digit mobile number"
          pattern="[6-9][0-9]{9}"
          maxlength="10" inputmode="numeric" required>
      </div>

      <div class="form-group">
        <label for="email">Email ID *</label>
        <input type="email" id="email" name="email"
          placeholder="Enter your email address" required>
      </div>

      <div class="form-group">
        <label for="gender">Gender *</label>
        <select id="gender" name="gender" required>
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
          <option value="Prefer not to say">Prefer not to say</option>
        </select>
      </div>

      <h2>Academic Information</h2>

      <!-- College -->
      <div class="form-group">
        <label for="college">College *</label>

        <select id="college" name="college" required>
          <option value="">Loading colleges...</option>
        </select>

        <input
          class="other-input"
          id="collegeOther"
          type="text"
          placeholder="Enter your college name"
          maxlength="150"
          autocomplete="organization"
        >
      </div>

      <!-- Course -->
      <div class="form-group">
        <label for="course">Course *</label>

        <select id="course" name="course" required disabled>
          <option value="">Select Course</option>
        </select>

        <input class="other-input" id="courseOther"
          type="text" placeholder="Enter your course"
          maxlength="100">
      </div>

      <!-- Year -->
      <div class="form-group">
        <label for="year">Year *</label>

        <select id="year" name="year" required disabled>
          <option value="">Select Year</option>
        </select>

        <input class="other-input" id="yearOther"
          type="text" placeholder="Enter your year"
          maxlength="50">
      </div>

      <!-- Semester -->
      <div class="form-group">
        <label for="semester">Semester *</label>

        <select id="semester" name="semester" required disabled>
          <option value="">Select Semester</option>
        </select>

        <input class="other-input" id="semesterOther"
          type="text" placeholder="Enter your semester"
          maxlength="50">
      </div>

      <!-- Branch -->
      <div class="form-group">
        <label for="branch">Branch *</label>

        <select id="branch" name="branch" required disabled>
          <option value="">Select Branch</option>
        </select>

        <input class="other-input" id="branchOther"
          type="text" placeholder="Enter your branch"
          maxlength="100">
      </div>

      <!-- Section -->
      <div class="form-group">
        <label for="section">Section *</label>

        <select id="section" name="section" required disabled>
          <option value="">Select Section</option>
        </select>

        <input class="other-input" id="sectionOther"
          type="text" placeholder="Enter your section"
          maxlength="50">
      </div>

      <div class="support-box">
        <strong>Facing any difficulties while filling out this form?</strong>

        <p>Please contact us for assistance:</p>

        <a href="mailto:support@talentfarm.ai">
          support@talentfarm.ai
        </a>
      </div>

      <button type="submit" id="submitButton">
        Submit Registration
      </button>

      <p id="message" role="status" aria-live="polite"></p>

    </form>
  </main>

  <script src="/app.js"></script>

</body>
</html>
